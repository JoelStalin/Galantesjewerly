name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Force rebuild web and Odoo addon update
        type: boolean
        default: false
      confirm_backup:
        description: Type BACKUP_REQUIRED to confirm blocking predeploy backup
        required: true
        type: string
        default: BACKUP_REQUIRED

permissions:
  contents: read
  deployments: write

concurrency:
  group: galantes-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || inputs.confirm_backup == 'BACKUP_REQUIRED' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://galantesjewelry.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Production deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          TARGET_SHA: ${{ github.sha }}
          FORCE_REBUILD: ${{ github.event_name == 'push' && 'false' || inputs.force_rebuild }}
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_SSH_USER || 'yoeli' }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          command_timeout: 60m
          envs: TARGET_SHA,FORCE_REBUILD
          script: |
            set -Eeuo pipefail
            cd /home/yoeli/galantesjewelry
            git remote set-url origin https://github.com/JoelStalin/Galantesjewerly.git
            
            # Execute blocking predeploy backup using canonical script
            log() { printf '[galantes-deploy] %%s\n' "$*"; }
            log "Running predeploy backup script..."
            chmod +x scripts/production/*.sh
            ./scripts/production/predeploy-backup.sh
            
            log "Fetching and checking out target SHA: $TARGET_SHA"
            git fetch origin main --tags
            git fetch origin "$TARGET_SHA" || true
            git checkout --detach -f "$TARGET_SHA"
            
            chmod +x scripts/production/*.sh
            ./scripts/production/preflight.sh
            ./scripts/production/deploy-from-github.sh "$TARGET_SHA"
