name: Publish Approved Inventory (Production)

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Type PUBLISH_APPROVED_INVENTORY to continue
        required: true
        type: string
      backup_manifest:
        description: Path or URI of the successful pre-deploy backup manifest
        required: true
        type: string
      confirm_cleanup:
        description: Type CLEANUP_CURRENT_INVENTORY to remove existing product templates after backup
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: galantes-inventory-production
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ inputs.confirm_publish == 'PUBLISH_APPROVED_INVENTORY' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://galantesjewelry.com
    env:
      GITHUB_ENVIRONMENT: production
      INVENTORY_AGENT_PRODUCTION_APPROVED: ${{ secrets.INVENTORY_AGENT_PRODUCTION_APPROVED }}
      INVENTORY_AGENT_CLEANUP_APPROVED: ${{ inputs.confirm_cleanup == 'CLEANUP_CURRENT_INVENTORY' && 'true' || 'false' }}
      ODOO_BASE_URL: ${{ secrets.ODOO_BASE_URL_PRODUCTION }}
      ODOO_DATABASE: ${{ secrets.ODOO_DATABASE_PRODUCTION }}
      ODOO_API_KEY: ${{ secrets.ODOO_API_KEY_PRODUCTION }}
      PRODUCTION_QA_EVIDENCE_URL: ${{ secrets.PRODUCTION_QA_EVIDENCE_URL }}
    steps:
      - name: Checkout canonical deploy repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require validated local-worker bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f data/inventory-agent/manifests/approved-products.json
          test -f data/inventory-agent/manifests/odoo-dry-run.json
          node - <<'NODE'
          const fs = require('fs');
          const dry = JSON.parse(fs.readFileSync('data/inventory-agent/manifests/odoo-dry-run.json'));
          if (!dry.ok || dry.errors?.length) throw new Error('Local worker dry-run is not valid');
          NODE

      - name: Require backup evidence
        env:
          BACKUP_MANIFEST: ${{ inputs.backup_manifest }}
        run: test -n "$BACKUP_MANIFEST"

      - name: Require explicit cleanup confirmation
        run: test "${{ inputs.confirm_cleanup }}" = "CLEANUP_CURRENT_INVENTORY"

      - name: Create blocking production backup
        uses: appleboy/ssh-action@v1.2.0
        env:
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_SSH_USER || 'yoeli' }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          command_timeout: 60m
          envs: GITHUB_SHA
          script: |
            set -Eeuo pipefail
            cd /home/yoeli/galantesjewelry
            chmod +x scripts/production/predeploy-backup.sh
            scripts/production/predeploy-backup.sh

      - name: Require post-publish QA plan
        run: test -n "$PRODUCTION_QA_EVIDENCE_URL"

      - name: Import and validate human approvals
        run: node scripts/inventory-agent/nodes.mjs review:import

      - name: Validate Odoo payloads without writes
        run: node scripts/inventory-agent/nodes.mjs odoo:dry-run

      - name: Validate production DTO through JSON-2
        run: node scripts/inventory-agent/nodes.mjs odoo:fields-export

      - name: Verify DTO gate
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('data/inventory-agent/manifests/odoo-product-template-fields.json'));
          if (!p.ok || p.dtoCoverage.missingInDto.length) {
            throw new Error(`DTO gate failed: ${JSON.stringify(p.dtoCoverage)}`);
          }
          NODE

      - name: Publish through protected JSON-2 adapter
        run: node scripts/inventory-agent/odoo-json2-publish.mjs

      - name: Record QA evidence requirement
        run: |
          printf '{"required":true,"evidence":"%s","profile":"Profile 9","naturalWidth":true}\n' "$PRODUCTION_QA_EVIDENCE_URL" \
            > data/inventory-agent/manifests/qa-evidence-required.json

      - name: Upload publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: inventory-production-publication-${{ github.sha }}
          path: |
            data/inventory-agent/manifests/approved-products.json
            data/inventory-agent/manifests/odoo-dry-run.json
            data/inventory-agent/manifests/odoo-product-template-fields.json
            data/inventory-agent/manifests/publication-result.json
            data/inventory-agent/manifests/qa-evidence-required.json

      # Browser QA must be attached as a required protected check before this
      # workflow is enabled for production. No tunnel or proxy is changed here.
