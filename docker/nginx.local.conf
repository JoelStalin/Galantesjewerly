events {}

http {
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 80;
        server_name orca.dev getupsoft.orca.dev galantesjewelry.orca.dev;
        return 301 https://$host$request_uri;
    }

    server {
        listen 80;
        server_name hermes.dev;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name orca.dev getupsoft.orca.dev galantesjewelry.orca.dev;
        ssl_certificate /etc/nginx/certs/orca.dev.pem;
        ssl_certificate_key /etc/nginx/certs/orca.dev-key.pem;
        set $orca_upstream http://orca-core:4173;
        location / {
            proxy_pass $orca_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl;
        server_name hermes.dev;
        ssl_certificate /etc/nginx/certs/orca.dev.pem;
        ssl_certificate_key /etc/nginx/certs/orca.dev-key.pem;
        set $hermes_upstream http://hermes:8000;
        location / {
            proxy_pass $hermes_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
